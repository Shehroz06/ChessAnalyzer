    <!-- Base -->
    <rect x="-15" y="18" width="30" height="5" rx="2.5"/>
    <!-- Body -->
    <path d="M-10,18 C-10,18 -12,8 -8,2 C-6,-2 -4,-6 2,-10 C4,-11 8,-11 10,-8 C12,-5 10,0 8,4 C6,8 4,12 2,18 Z" fill="white"/>
    <!-- Head -->
